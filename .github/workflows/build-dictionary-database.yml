name: Build complete dictionary database

on:
  workflow_dispatch:
    inputs:
      smoke_test_limit:
        description: "Optional maximum English records (leave blank for full build)"
        required: false
        type: string
        default: "1000"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run importer tests
        run: python -m unittest discover -s tests -v

      - name: Build SQLite database
        shell: bash
        run: |
          LIMIT="${{ inputs.smoke_test_limit }}"
          if [ -n "$LIMIT" ]; then
            python scripts/ingest_wiktextract.py --limit "$LIMIT" --output build/dictionary.sqlite3
          else
            python scripts/ingest_wiktextract.py --output build/dictionary.sqlite3
          fi

      - name: Report database size and record count
        run: |
          python - <<'PY'
          import os, sqlite3
          p = "build/dictionary.sqlite3"
          db = sqlite3.connect(p)
          count = db.execute("SELECT COUNT(*) FROM entries").fetchone()[0]
          print(f"English source records: {count:,}")
          print(f"SQLite size: {os.path.getsize(p):,} bytes")
          db.close()
          PY

      - name: Upload database artifact
        uses: actions/upload-artifact@v4
        with:
          name: ensu-dictionary-sqlite
          path: build/dictionary.sqlite3
          if-no-files-found: error
          retention-days: 14
