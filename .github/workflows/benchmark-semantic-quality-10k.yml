name: Benchmark 10K semantic quality
on:
  workflow_dispatch:
jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout dictionary edition
        uses: actions/checkout@v4
      - name: Checkout Ensu source
        uses: actions/checkout@v4
        with:
          repository: ente-io/ente
          path: upstream
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y clang cmake libvulkan-dev glslc spirv-headers
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Python dependencies
        run: python -m pip install --upgrade pip && python -m pip install llama-cpp-python==0.3.36 zstandard==0.23.0
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Run semantic quality benchmark
        run: python scripts/benchmark_ensu_10k.py --pack-zip test-fixtures/dictionary-10k-v1.zip --upstream upstream
      - name: Upload quality report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ensu-10k-semantic-quality-report
          path: semantic-quality-report.json
          if-no-files-found: ignore
